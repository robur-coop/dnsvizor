name: Build
on: [push]

jobs:
  build:
    runs-on: ["medium", "debian-13-x86_64"]
    steps:
      - name: Install opam
        run: DEBIAN_FRONTEND=noninteractive sudo -E apt install --yes opam

      - name: Setup opam
        run: opam init -a --comp=4.14.4

      - name: Setup MirageOS
        run: eval `opam env` && opam install --confirm-level=unsafe-yes "mirage>4.10.0" "ocaml-solo5"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure unikernel
        run: eval `opam env` && mirage configure -t hvt -f config.ml

      - name: Install dependencies
        run: eval `opam env` && make depend

      - name: Build unikernel
        run: eval `opam env` && make build
